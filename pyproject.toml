[project]
name = "raceline"
version = "0.1.0"
description = "Eval-driven triathlon race finish-time predictor: predicts race times from Strava training history and backtests itself against Riegel's formula and Strava's own estimate."
requires-python = ">=3.11"
dependencies = [
    # Web framework + server for the app/ tier.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Jinja2 templating for the server-rendered dashboard (Phase 6), pulled in
    # now so app/main.py's Jinja2Templates wiring doesn't need a later dep bump.
    "jinja2>=3.1",
    # Env-driven settings (app/config.py) with validation, instead of raw os.environ.
    "pydantic-settings>=2.5",
    # ORM + migrations (see DESIGN.md "ORM/migrations" decision).
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # psycopg v3 binary build — avoids needing build tools in the Docker image
    # to compile the Postgres C extension.
    "psycopg[binary]>=3.2",
    # Redis + RQ back the ingestion job queue (Phase 2) — declared now so the
    # worker/ package has its runtime deps from the first scaffold.
    "redis>=5.0",
    "rq>=1.16",
    # Fernet symmetric encryption for OAuth tokens at rest (Phase 1, app/security.py).
    "cryptography>=43.0",
    # HTTP client for calling Strava's OAuth endpoints (Phase 1) and, later,
    # its activities API (Phase 2). Also what FastAPI's TestClient uses.
    "httpx>=0.27",
    # Signs the session cookie (Starlette's SessionMiddleware) that
    # identifies a logged-in user across requests — there's no password
    # auth, so this cookie *is* the login mechanism (app/main.py).
    "itsdangerous>=2.2",
    # Feature matrix shape for the trained model (ml/features.py, Phase 4) —
    # DB rows -> DataFrame, per DESIGN.md.
    "pandas>=2.0",
    # ml/gradient_boosting.py's HistGradientBoostingRegressor (Phase 4) — the
    # one sklearn estimator that accepts NaN features natively, which matters
    # given this project's explicit-null feature contract (see that module's
    # docstring for why that beats imputing).
    "scikit-learn>=1.3",
    # Persists a fitted Predictor to model_artifacts/<id>.joblib (ml/train.py,
    # Phase 4). Already a transitive scikit-learn dependency; declared
    # explicitly since ml/train.py imports it directly.
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling needs an explicit package list because this repo has multiple
# top-level packages (app/, worker/, ingestion/, ml/, evaluation/) rather
# than a single src/ layout. Extend this list if a later phase adds a new
# top-level package.
[tool.hatch.build.targets.wheel]
packages = ["app", "worker", "ingestion", "ml", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic generates these from migrations/script.py.mako, which we don't
# control — linting them would mean fighting Alembic's own template on
# every future migration instead of writing app code.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
