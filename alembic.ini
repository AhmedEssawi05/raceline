; Alembic config. WHAT: points Alembic at migrations/ and disables the
; sqlalchemy.url here in favor of reading DATABASE_URL at runtime (see
; migrations/env.py) — WHY: keeping the DB URL out of a committed .ini file
; means the same alembic.ini works against local, CI, and (eventually)
; deployed databases without editing this file per environment.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
